<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc"><title id="title">LaunchNotes — Your commits, ready to ship.</title><desc id="desc">Fictional commit messages organized into features, fixes, and documentation release notes.</desc><rect width="1280" height="520" fill="#10120f"/><path d="M0 450H1280M746 0V520" stroke="#33382d"/><rect x="62" y="49" width="42" height="42" rx="4" fill="#cef774"/><text x="72" y="80" fill="#18200e" font-family="sans-serif" font-weight="bold" font-size="30">L</text><text x="118" y="79" fill="#edf0e6" font-family="sans-serif" font-size="27" font-weight="bold">LaunchNotes</text><text x="65" y="152" fill="#cef774" font-family="monospace" font-size="12" letter-spacing="3">FROM GIT HISTORY TO GOOD NEWS</text><text x="60" y="237" fill="#edf0e6" font-family="sans-serif" font-size="60" font-weight="bold">Your commits.</text><text x="60" y="306" fill="#cef774" font-family="sans-serif" font-size="60" font-weight="bold">Ready to ship.</text><text x="65" y="365" fill="#a4ad98" font-family="sans-serif" font-size="18">Clear release notes and launch posts from the work you did.</text><rect x="795" y="105" width="405" height="287" rx="10" fill="#191c17" stroke="#33382d"/><text x="822" y="141" fill="#a4ad98" font-family="monospace" font-size="11">RELEASE NOTES · V1.8.0</text><path d="M821 157H1175" stroke="#33382d"/><text x="822" y="197" fill="#cef774" font-family="sans-serif" font-size="17" font-weight="bold">Features</text><text x="828" y="225" fill="#edf0e6" font-family="monospace" font-size="12">• add keyboard shortcuts</text><text x="828" y="248" fill="#edf0e6" font-family="monospace" font-size="12">• remember selected theme</text><text x="822" y="292" fill="#cef774" font-family="sans-serif" font-size="17" font-weight="bold">Fixes</text><text x="828" y="320" fill="#edf0e6" font-family="monospace" font-size="12">• keep preview in sync</text><text x="822" y="360" fill="#d7b9ff" font-family="sans-serif" font-size="13">No account. No AI. No upload.</text><text x="65" y="487" fill="#a4ad98" font-family="monospace" font-size="11" letter-spacing="1">OPEN SOURCE UNDER MIT · BUILT BY OKAN TIKTAS</text></svg>
